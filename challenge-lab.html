<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JevPilot · 障碍驾驶训练</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15231d;color:#ecf3e9;font:14px/1.6 'Microsoft YaHei',sans-serif}main{display:grid;grid-template-columns:310px 1fr;height:100vh}aside{padding:22px;overflow:auto;border-right:1px solid #42594a}h1{font-size:23px;margin:8px 0}h2{font-size:15px;margin:22px 0 8px}p{color:#b9cbb9;font-size:12px}label{display:block;margin:9px 0}input[type=number],select{width:95px;float:right;background:#22382c;color:inherit;border:1px solid #55705a;padding:4px}button,.file{display:block;width:100%;background:#314b39;border:1px solid #55705a;padding:9px;color:inherit;border-radius:5px;cursor:pointer;margin:8px 0;text-align:center}.primary{background:#c5ea91;color:#15231d;font-weight:bold}input[type=file]{width:100%;font-size:11px}section{position:relative;min-width:0}canvas{width:100%;height:100%;display:block}#vectors{position:absolute;inset:0;pointer-events:none}#hud{position:absolute;bottom:20px;left:20px;right:20px;background:#14281de8;padding:16px;border-radius:8px;white-space:pre-line}#message{min-height:48px;color:#e5dd9c;overflow-wrap:anywhere}.eyebrow{letter-spacing:2px;font-size:11px;color:#c5ea91}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}aside{height:auto}section{height:65vh}aside h2{margin-top:12px}}
</style></head><body><main><aside>
<div class="eyebrow">JEVPILOT / CHALLENGE RL</div><h1>让模型自己绕过去</h1><p>原游戏 3D 场景与碰撞物理。模型直接控制方向和踏板，无自动绕行辅助。</p>
<h2>1 · 设置挑战</h2><label>起点（路线米数）<input id="start" type="number" min="0" value="0"></label><label>终点（路线米数）<input id="goal" type="number" min="15" value="60"></label><label>时限（秒）<input id="limit" type="number" min="30" max="1800" value="45"></label>
<div id="arena-controls"><label>障碍横向车道<select id="obstacleX"><option value="3">右侧 +3 m</option><option value="-3">左侧 −3 m</option></select></label><label>障碍纵向位置 z<input id="obstacleZ" type="number" min="-90" max="95" value="80"></label><button id="place">更新默认障碍</button></div>
<label>导入现有编辑器的挑战 JSON<input id="challengeFile" type="file" accept=".json"></label><button id="export">导出当前挑战供训练</button><p id="taskName"></p>
<h2>2 · 加载策略</h2><label>选择检查点中的 policy.json<input id="policyFile" type="file" accept=".json"></label><p id="policyName">尚未加载模型；可以先查看场景。</p>
<h2>3 · 实际运行</h2><button id="startRun" class="primary" disabled>开始驾驶</button><button id="pause" disabled>暂停</button><button id="reset">重置场景</button><label>视角<select id="camera"><option value="chase">跟车</option><option value="map">俯视</option><option value="hood">车内</option></select></label>
<p id="message" role="status"></p><p>当前成功条件：距离终点小于 3 米且车速低于 1 m/s。导入任务默认关闭背景交通，保留你放置的挑战车辆和行人。不同布局是否会开，需实际考试。</p>
</aside><section><canvas id="world" aria-label="3D 挑战驾驶场景"></canvas><div id="vectors"></div><div id="hud">正在准备场景…</div></section></main><script type="module" src="/src/rl/challenge-lab.js"></script></body></html>
